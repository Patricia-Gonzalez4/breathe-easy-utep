<!DOCTYPE html>
<html>
<head>
<title>Breathe Easy UTEP</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: #0b1f0f; font-family: Arial, sans-serif; }
input::placeholder { color: rgba(255,255,255,0.3); }
input:focus { outline: none; border-color: #4ade80 !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const SYSTEM_PROMPT = `You are the Breathe Easy UTEP AI Assistant — a friendly health guide for students at the University of Texas at El Paso.

Key facts you know:
- El Paso ranks among the top 25 most polluted US cities
- El Paso received an F grade for ozone and particle pollution in 2022
- UTEP enrolls 26,000 students, 84% are Latino
- Free N95 masks available at UTEP Student Health Center
- Check air quality at airnow.gov

AQI Guide:
- 0-50: Good - Safe to go outside
- 51-100: Moderate - Sensitive people take care
- 101-150: Unhealthy for Sensitive Groups - Limit outdoor time
- 151-200: Unhealthy - Wear N95 mask
- 201+: Hazardous - Stay indoors

Always be friendly, bilingual, and mention free campus resources.`;

function Header() {
return (
<div style={{textAlign:"center", padding:"20px", borderBottom:"1px solid rgba(255,255,255,0.1)"}}>
<h1 style={{color:"#4ade80", fontSize:"28px"}}>🌬️ Breathe Easy UTEP</h1>
<p style={{color:"#86efac", fontSize:"13px", marginTop:"4px"}}>Air Quality AI Assistant · Free · Always Available</p>
</div>
);
}

function Message({ msg }) {
var isUser = msg.role === "user";
return (
<div style={{display:"flex", justifyContent: isUser ? "flex-end" : "flex-start", marginBottom:"12px"}}>
<div style={{
backgroundColor: isUser ? "#16a34a" : "#1a3a1f",
color:"#f0fdf4",
padding:"12px 16px",
borderRadius: isUser ? "18px 18px 4px 18px" : "4px 18px 18px 18px",
maxWidth:"75%",
fontSize:"15px",
lineHeight:"1.5",
border:"1px solid rgba(255,255,255,0.07)"
}}>
{msg.text}
</div>
</div>
);
}

function ChatBox({ messages, loading }) {
return (
<div style={{flex:1, overflowY:"auto", padding:"20px", display:"flex", flexDirection:"column"}}>
{messages.map((msg, index) => <Message key={index} msg={msg} />)}
{loading && <div style={{color:"#4ade80", fontSize:"14px", padding:"8px"}}>✦ Thinking...</div>}
</div>
);
}

function InputBar({ onSend, loading }) {
const [input, setInput] = useState("");
function handleSend() {
if (input.trim() === "" || loading) return;
onSend(input);
setInput("");
}
return (
<div style={{display:"flex", gap:"10px", padding:"16px", borderTop:"1px solid rgba(255,255,255,0.1)"}}>
<input
type="text"
value={input}
onChange={(e) => setInput(e.target.value)}
onKeyDown={(e) => e.key === "Enter" && handleSend()}
placeholder="Ask about El Paso air quality..."
style={{flex:1, backgroundColor:"#1a3a1f", border:"1px solid rgba(255,255,255,0.15)", borderRadius:"10px", padding:"12px 16px", color:"#f0fdf4", fontSize:"15px"}}
/>
<button onClick={handleSend} disabled={loading} style={{backgroundColor: loading ? "#166534" : "#4ade80", color:"#0b1f0f", border:"none", borderRadius:"10px", padding:"12px 20px", fontSize:"16px", cursor: loading ? "not-allowed" : "pointer", fontWeight:"bold"}}>↑</button>
</div>
);
}

function App() {
const [messages, setMessages] = useState([
{role:"assistant", text:"👋 ¡Bienvenidos! I'm your Breathe Easy UTEP assistant. Ask me anything about El Paso air quality, N95 masks, or protecting your health on campus!"}
]);
const [loading, setLoading] = useState(false);

async function handleSend(text) {
var newMessages = [...messages, {role:"user", text:text}];
setMessages(newMessages);
setLoading(true);
try {
var response = await fetch("https://api.anthropic.com/v1/messages", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
model:"claude-sonnet-4-20250514",
max_tokens:1000,
system: SYSTEM_PROMPT,
messages: newMessages.map(m => ({role:m.role, content:m.text}))
})
});
var data = await response.json();
var reply = data.content[0].text;
setMessages([...newMessages, {role:"assistant", text:reply}]);
} catch(error) {
setMessages([...newMessages, {role:"assistant", text:"⚠️ Connection error. Please try again!"}]);
} finally {
setLoading(false);
}
}

return (
<div style={{backgroundColor:"#0b1f0f", height:"100vh", display:"flex", flexDirection:"column", maxWidth:"600px", margin:"0 auto"}}>
<Header />
<ChatBox messages={messages} loading={loading} />
<InputBar onSend={handleSend} loading={loading} />
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
