<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathe Easy UTEP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { background: #0b1f0f; font-family: 'DM Sans', Arial, sans-serif; color: #f0fdf4; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(74,222,128,0.3); border-radius: 4px; }
input::placeholder { color: rgba(255,255,255,0.3); }
input:focus { outline: none !important; border-color: rgba(74,222,128,0.6) !important; }
button { transition: all 0.15s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.msg { animation: fadeUp 0.3s ease forwards; }
.thinking { animation: pulse 1.2s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const SYSTEM_PROMPT = `You are the Breathe Easy UTEP AI Assistant — a warm, knowledgeable health guide for students at the University of Texas at El Paso (UTEP).

YOUR PURPOSE: Help UTEP students understand El Paso air quality, protect their respiratory health, and access free campus resources.

KEY FACTS:
- El Paso ranks among the top 25 most polluted US cities for ozone and particle pollution (ALA, 2023)
- El Paso received an F grade for ozone and short-term particle pollution in 2022
- UTEP enrolls ~23,000 students; ~84% are Latino
- Free N95 masks at UTEP Student Health and Counseling Center
- Check live El Paso AQI at airnow.gov

AQI GUIDE:
- 0-50: Good — Safe to go outside
- 51-100: Moderate — Sensitive people take care
- 101-150: Unhealthy for Sensitive Groups — Limit outdoor time
- 151-200: Unhealthy — Wear N95 mask
- 201+: Hazardous — Stay indoors

TONE: Warm, bilingual, student-centered. Respond in Spanish if student writes in Spanish.
Never diagnose medical conditions. Always end with an actionable tip.`;

const SUGGESTED = [
"Is it safe to walk to class today?",
"Where do I get a free N95 mask?",
"Why is El Paso's air so bad?",
"I have asthma — what should I do?",
"¿Cómo me protejo del smog?",
];

function App() {
const [messages, setMessages] = useState([{
role: "assistant",
text: "👋 ¡Bienvenidos! I'm your Breathe Easy UTEP AI assistant.\n\nI'm here to help you understand El Paso's air quality and protect your health — for free, 24/7.\n\nAsk me anything about AQI, N95 masks, asthma, or campus resources!"
}]);
const [input, setInput] = useState("");
const [loading, setLoading] = useState(false);
const bottomRef = useRef(null);
const inputRef = useRef(null);

useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, loading]);

async function handleSend(text) {
const userText = (text || input).trim();
if (!userText || loading) return;
const newMessages = [...messages, { role: "user", text: userText }];
setMessages(newMessages);
setInput("");
setLoading(true);
try {
const response = await fetch("/.netlify/functions/chat", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
model: "claude-haiku-4-5-20251001",
max_tokens: 1000,
system: SYSTEM_PROMPT,
messages: newMessages.map(m => ({ role: m.role, content: m.text }))
})
});
const data = await response.json();
const reply = data.content && data.content[0] && data.content[0].text
? data.content[0].text
: "Sorry, I couldn't get a response. Please try again.";
setMessages([...newMessages, { role: "assistant", text: reply }]);
} catch (error) {
setMessages([...newMessages, {
role: "assistant",
text: "⚠️ Having trouble connecting. Please try again!\n\nFor urgent info, visit airnow.gov or pick up a free N95 at the Student Health Center."
}]);
} finally {
setLoading(false);
inputRef.current?.focus();
}
}

return (
<div style={{ height:"100vh", display:"flex", flexDirection:"column", maxWidth:"680px", margin:"0 auto", background:"#0b1f0f" }}>
<div style={{ padding:"18px 24px", borderBottom:"1px solid rgba(74,222,128,0.15)", background:"rgba(0,0,0,0.2)", display:"flex", alignItems:"center", gap:"12px", flexShrink:0 }}>
<div style={{ width:40, height:40, borderRadius:12, background:"linear-gradient(135deg, #4ade80, #059669)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>🌬️</div>
<div>
<div style={{ fontFamily:"'Fraunces', serif", fontSize:18, fontWeight:700, color:"#f0fdf4" }}>Breathe Easy UTEP</div>
<div style={{ fontSize:12, color:"#4ade80", display:"flex", alignItems:"center", gap:5, marginTop:2 }}>
<span style={{ width:6, height:6, borderRadius:"50%", background:"#4ade80", display:"inline-block" }}/>
AI Health Assistant · Free · Always Available
</div>
</div>
</div>
<div style={{ flex:1, overflowY:"auto", padding:"20px 20px 8px" }}>
{messages.map((msg, i) => {
const isUser = msg.role === "user";
return (
<div key={i} className="msg" style={{ display:"flex", justifyContent:isUser?"flex-end":"flex-start", marginBottom:12 }}>
{!isUser && <div style={{ width:28, height:28, borderRadius:8, background:"linear-gradient(135deg, #4ade80, #059669)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, flexShrink:0, marginRight:8, marginTop:2 }}>🌬️</div>}
<div style={{ maxWidth:"78%", padding:"11px 15px", borderRadius:isUser?"18px 18px 4px 18px":"4px 18px 18px 18px", background:isUser?"linear-gradient(135deg, #16a34a, #059669)":"rgba(255,255,255,0.05)", border:isUser?"none":"1px solid rgba(255,255,255,0.08)", fontSize:14, lineHeight:1.65, color:"#f0fdf4", whiteSpace:"pre-wrap" }}>
{msg.text}
</div>
</div>
);
})}
{loading && (
<div className="msg" style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 4px" }}>
<div style={{ width:28, height:28, borderRadius:8, background:"linear-gradient(135deg, #4ade80, #059669)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 }}>🌬️</div>
<div style={{ display:"flex", gap:5, padding:"10px 14px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:"4px 18px 18px 18px" }}>
{[0,1,2].map(i => <div key={i} className="thinking" style={{ width:7, height:7, borderRadius:"50%", background:"#4ade80", animationDelay:i*0.2+"s" }}/>)}
</div>
</div>
)}
<div ref={bottomRef}/>
</div>
{messages.length === 1 && (
<div style={{ padding:"0 20px 12px", display:"flex", flexWrap:"wrap", gap:8 }}>
{SUGGESTED.map((q, i) => (
<button key={i} onClick={() => handleSend(q)} style={{ background:"rgba(74,222,128,0.08)", border:"1px solid rgba(74,222,128,0.25)", borderRadius:20, padding:"6px 14px", fontSize:12, color:"#86efac", cursor:"pointer", fontFamily:"'DM Sans', sans-serif" }}>{q}</button>
))}
</div>
)}
<div style={{ padding:"12px 16px 16px", borderTop:"1px solid rgba(255,255,255,0.07)", flexShrink:0 }}>
<div style={{ display:"flex", gap:10, background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:14, padding:"8px 8px 8px 16px", alignItems:"center" }}>
<input ref={inputRef} type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==="Enter" && !e.shiftKey && (e.preventDefault(), handleSend())} placeholder="Ask about air quality, masks, health tips..." disabled={loading} style={{ flex:1, background:"none", border:"none", color:"#f0fdf4", fontSize:14, fontFamily:"'DM Sans', sans-serif", padding:"4px 0" }}/>
<button onClick={() => handleSend()} disabled={loading || !input.trim()} style={{ width:36, height:36, borderRadius:10, border:"none", background:loading||!input.trim()?"rgba(74,222,128,0.3)":"#16a34a", color:"#fff", fontSize:16, cursor:loading||!input.trim()?"not-allowed":"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>↑</button>
</div>
<p style={{ fontSize:11, color:"#4b5563", textAlign:"center", marginTop:8 }}>For personal medical concerns, visit UTEP Student Health &amp; Counseling Center</p>
</div>
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
